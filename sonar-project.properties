sonar.projectKey=Ansible
sonar.projectName=Ansible
sonar.sources=.
sonar.host.url=https://sonarqube-sonarqube-sonarqube.apps.ocpv.citiuscloud.local
# Token is injected at runtime via CI/CD environment variable — never hard-code here
# Pass via pipeline: sonar-scanner -Dsonar.token=$SONAR_TOKEN

# ---- Directories & file types to exclude from ALL analysis ----
# test/tests       - Unit and integration tests
# hacking          - Developer scripts and tools
# docs             - Documentation
# packaging        - Packaging scripts
# .azure-pipelines - CI/CD pipeline scripts
# .github          - GitHub workflows and templates
# .claude          - AI assistant config
# .scannerwork     - SonarQube scanner temp files
# bin              - Wrapper scripts (not source)
# changelogs       - Changelog fragments
# licenses         - License text files
# *.md, *.rst, etc - Documentation and config files

# Exclude from source code analysis (bugs, code smells, vulnerabilities, issues)
sonar.exclusions=**/test/**,**/tests/**,**/hacking/**,**/docs/**,**/packaging/**,**/.azure-pipelines/**,**/.github/**,**/.claude/**,**/.scannerwork/**,**/bin/**,**/changelogs/**,**/licenses/**,**/*.md,**/*.rst,**/*.txt,**/*.toml,**/*.cfg,**/*.ini,**/*.in

# Exclude from security hotspot detection (the security "cards")
sonar.security.hotspots.exclusions=**/test/**,**/tests/**,**/hacking/**,**/docs/**,**/packaging/**,**/.azure-pipelines/**,**/.github/**,**/.claude/**,**/.scannerwork/**,**/bin/**,**/changelogs/**,**/licenses/**,**/*.md,**/*.rst,**/*.txt,**/*.toml,**/*.cfg,**/*.ini,**/*.in

# Exclude from coverage analysis
sonar.coverage.exclusions=**/test/**,**/tests/**,**/hacking/**,**/docs/**,**/packaging/**,**/.azure-pipelines/**,**/.github/**,**/.claude/**,**/.scannerwork/**,**/bin/**,**/changelogs/**,**/licenses/**,**/*.md,**/*.rst,**/*.txt,**/*.toml,**/*.cfg,**/*.ini,**/*.in